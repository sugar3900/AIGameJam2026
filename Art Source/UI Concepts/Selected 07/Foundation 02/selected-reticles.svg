s use a dark disk and a shared 19 px icon box.</text><text x="44" y="628" fill="#1F7384" font-family="Barlow Condensed" font-size="26" font-weight="800" font-style="italic"  transform="translate(0,628) skewX(-5.129805863840847) translate(0,-628)">UNAVAILABLE IS RESERVED</text><text x="44" y="668" fill="#11414A" font-family="Barlow" font-size="25" font-weight="400" font-style="normal" >Not currently emitted by the game. Use only for a recognizable, explicitly blocked target with a reason.</text><text x="44" y="709" fill="#11414A" font-family="Barlow" font-size="25" font-weight="400" font-style="normal" >No target / out of range → default. Menus / dialogue → world reticle hidden; separate UI cursor.</text></svg>