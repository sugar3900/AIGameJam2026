<text x="1025" y="305" class="label" text-anchor="start">6.36 × 4.55 m; bedroom 6.36 × 5.45 m.</text>
<text x="1025" y="330" class="label" text-anchor="start">Office and bath each 3.18 × 4.55 m.</text>
<text x="1025" y="355" class="label" text-anchor="start">Bath has exterior window; narrower</text>
<text x="1025" y="380" class="label" text-anchor="start">rooms are the tradeoff.</text>
