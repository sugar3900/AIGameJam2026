anchor="start" font-weight="normal" fill="#5e5145">door candidate</text><text x="1060.00" y="261.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">   + KI-JAR-01</text><text x="1060.00" y="275.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">14. Sink / leak [projection] — KI-SINK-NARROW-01</text><text x="1060.00" y="289.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">· Lukey leak / repaired</text><text x="1060.00" y="303.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">   + faucet, KI-BUCKET-01</text><text x="1060.00" y="317.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">20. Dining table [projection] — KI-TABLE-01</text><text x="1060.00" y="331.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">   + KI-BOWL-01</text><text x="1060.00" y="345.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">21. Chair [projection] — KI-CHAIR-01</text><text x="1060.00" y="359.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">22. Chair [projection] — KI-CHAIR-01</text><text x="1060.00" y="373.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">15. Counter [projection] — KI-CABINET-01 ·</text><text x="1060.00" y="387.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">drawer / door candidate</text><text x="1060.00" y="401.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">   + KI-BOWL-01</text><text x="1060.00" y="415.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">16. Prep / uppers [projection] — KI-CABINET-01 ·</text><text x="1060.00" y="429.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">drawer / door candidate</text><text x="1060.00" y="443.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">   + KI-MUG-01, KI-POTTERY-01</text><text x="1060.00" y="457.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">Ceiling: ARC-CEILING-LIGHT-01; one physical</text><text x="1060.00" y="471.00" font-family="Arial,sans-serif" font-size="10" text-anchor="start" font-weight="normal" fill="#5e5145">fixture, not a copy per wall.</text><text x="65.00" y="505.00" font-family="Arial,sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5e5145">Range at northwest corner; source depth includes controls. Window remains clear of counter/sink. Full-size pantry sits beside fridge after the</text><text x="65.00" y="521.00" font-family="Arial,sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#5e5145">user swap.</text></svg>