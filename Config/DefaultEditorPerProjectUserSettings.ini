; Unreal MCP server (Engine/Plugins/Experimental/ModelContextProtocol).
; Port 8001 so it can run alongside another editor on the default 8000.
; Claude Code picks it up via .mcp.json in the repo root.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8001
bAutoStartServer=True
bEnableToolSearch=True

[/Script/UnrealEd.EditorPerProjectUserSettings]
bDisplayDocumentationLink=False

[/Script/UnrealEd.EditorLoadingSavingSettings]
bMonitorContentDirectories=True
