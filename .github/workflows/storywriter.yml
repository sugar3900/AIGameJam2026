name: StoryWriter

# Builds self-contained single-file StoryWriter executables and publishes them to the rolling
# "storywriter-latest" release whenever the tool changes on main (or on manual dispatch).
on:
  push:
    branches: [main]
    paths: ['Tools/StoryWriter/**', '.github/workflows/storywriter.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish ${{ matrix.rid }}
        run: Tools/StoryWriter/publish.sh ${{ matrix.rid }}
      - name: Zip (keeps the executable bit)
        working-directory: Tools/StoryWriter/dist
        run: zip -r ../StoryWriter-${{ matrix.rid }}.zip ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: StoryWriter-${{ matrix.rid }}
          path: Tools/StoryWriter/StoryWriter-${{ matrix.rid }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete storywriter-latest --cleanup-tag --yes || true
          gh release create storywriter-latest out/*.zip \
            --target "${{ github.sha }}" --prerelease \
            --title "StoryWriter (latest)" \
            --notes "Self-contained StoryWriter builds from ${{ github.sha }}. Unzip and run; no .NET needed."
